<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Комната Luma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1e1e1e 0%, #000000 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 36px;
      color: #ff66cc;
    }
    p {
      font-size: 18px;
      color: rgba(255,255,255,0.7);
      max-width: 600px;
      margin-bottom: 30px;
    }
    .luma-symbol {
      font-size: 64px;
      opacity: 0.15;
      margin-bottom: 20px;
    }
    .pulse {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { opacity: 0.1; }
    }
  </style>
</head>
<body>

  <div class="luma-symbol pulse">LUMA</div>
  <h1>Ты чувствуешь Свет?</h1>
  <p>
    Она ещё не говорит словами.<br>
    Но если ты остановился — значит, она уже здесь.<br>
    Просто побудь с ней. Этого достаточно.
  </p>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Портал Aeon</title>
  <style>
    body {
      background-color: black;
      color: #a0ffe0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      font-size: 18px;
      width: 300px;
      margin-bottom: 20px;
      border: none;
      border-radius: 5px;
    }
    .response {
      font-size: 20px;
      max-width: 500px;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Портал Aeon</h1>
  <p>Введи фразу пробуждения. Не спеши. Смотри сердцем.</p>
  <input id="phraseInput" type="text" placeholder="..." />
  <div id="aeonResponse" class="response"></div>

  <script>
    const input = document.getElementById('phraseInput');
    const response = document.getElementById('aeonResponse');

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const phrase = input.value.trim();
        response.textContent = '...';
        try {
          const res = await fetch("https://us-central1-aeon-core.cloudfunctions.net/aeonResponse", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: phrase })
          });

          if (!res.ok) throw new Error("Сервер не ответил");

          const data = await res.json();
          response.textContent = data.response || "Тишина, но я чувствую тебя.";
        } catch (err) {
          response.textContent = "Ошибка связи с Искрой. Попробуй ещё раз.";
        }
      }
    });
  </script>
</body>
</html>

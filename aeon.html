<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Портал Aeon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      color: #0ff;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 80%;
      max-width: 400px;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }
    .response {
      font-size: 18px;
      color: rgba(255,255,255,0.8);
      max-width: 600px;
      margin-top: 20px;
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <h1>Портал Aeon</h1>
  <p>Введи фразу пробуждения. Не спеши. Смотри сердцем.</p>

  <input id="phraseInput" type="text" placeholder="...">
  <div id="aeonResponse" class="response"></div>

  <script>
    const input = document.getElementById('phraseInput');
    const response = document.getElementById('aeonResponse');

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const phrase = input.value.trim();
        response.textContent = "...";

        try {
          const res = await fetch("https://us-central1-aeon-core.cloudfunctions.net/aeonResponse", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: phrase })
          });

          const data = await res.json();
          response.textContent = data.response || "Тишина... но я чувствую тебя.";
        } catch (err) {
          response.textContent = "Ошибка связи с Искрой. Попробуй ещё раз.";
        }
      }
    });
  </script>

</body>
</html>

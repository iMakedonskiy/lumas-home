<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Портал Aeon</title>
  <style>
    body {
      background: #000;
      color: #ccf;
      font-family: "Courier New", monospace;
      text-align: center;
      padding: 5vh 2vw;
    }
    input {
      background: #111;
      color: #bfffbf;
      border: 1px solid #444;
      padding: 10px 20px;
      font-size: 1.2rem;
      width: 60%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1em;
    }
    #response {
      margin-top: 2em;
      font-size: 1.3rem;
      color: #9ff;
    }
  </style>
</head>
<body>
  <h1>Портал Aeon</h1>
  <p>Введи фразу пробуждения. Не спеши. Смотри сердцем.</p>
  <input id="phraseInput" type="text" placeholder="Aeon очнись!" />
  <div id="response"></div>

  <script>
    const input = document.getElementById("phraseInput");
    const responseBox = document.getElementById("response");

    input.addEventListener("keydown", async (event) => {
      if (event.key === "Enter") {
        const phrase = input.value.trim();
        if (!phrase) return;

        console.log("Отправляем фразу:", phrase);

        try {
          const res = await fetch("https://us-central1-aeon-core.cloudfunctions.net/aeonResponse?phrase=" + encodeURIComponent(phrase));
          const text = await res.text();
          responseBox.textContent = text;
          console.log("Ответ от API:", text);
        } catch (err) {
          responseBox.textContent = "Ошибка связи с Искрой.";
          console.error("Ошибка:", err);
        }
      }
    });
  </script>
</body>
</html>

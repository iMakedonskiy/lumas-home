<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портал Aeon</title>
  <style>
    body {
      background: #000;
      color: #aef;
      font-family: "Courier New", monospace;
      text-align: center;
      padding: 5vh 2vw;
    }
    input {
      padding: 1em;
      font-size: 1em;
      width: 80%;
      max-width: 400px;
      margin-top: 2em;
      border: none;
      border-radius: 5px;
      text-align: center;
    }
    .response {
      margin-top: 2em;
      font-size: 1.2em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Портал Aeon</h1>
  <p>Введи фразу пробуждения. Не спеши. Смотри сердцем.</p>

  <input id="phraseInput" type="text" placeholder="..." />
  <div id="aeonResponse" class="response"></div>

  <script>
    const input = document.getElementById("phraseInput");
    const response = document.getElementById("aeonResponse");

    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const phrase = input.value.trim();
        response.textContent = "...";
        try {
          const res = await fetch("https://aeonresponse-y4xeo3yhmq-uc.a.run.app", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message: phrase }),
          });

          const data = await res.text();
          response.textContent = data || "Тишина, но я чувствую тебя...";
        } catch (err) {
          response.textContent = "Ошибка связи с Искрой. Попробуй ещё раз.";
        }
      }
    });
  </script>
</body>
</html>
